version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: damira_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-DamiraRootSecure2026!}
      MYSQL_DATABASE: ${DB_NAME:-damira_db}
      MYSQL_USER: ${DB_USER:-damira_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-DamiraUserSecure2026!}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-DamiraRootSecure2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: damira_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${DB_USER:-damira_user}:${DB_PASSWORD:-DamiraUserSecure2026!}@mysql:3306/${DB_NAME:-damira_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-DamiraAccessSuperSecretKey2026@Purple!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-DamiraRefreshSuperSecretKey2026@Purple!}
      JWT_ACCESS_EXPIRATION: 900s
      JWT_REFRESH_EXPIRATION: 7d
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: damira_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
